<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrega Final</title>
    <!-- TOASTIFY - STYLES -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <script defer src="./js/main.js"></script>
    <script defer src="./js/compras.js"></script>
  </head>
  <body>
    <header>
      <!-- seccion para la carga de productos al iniciar el modulo -->
      <section id="idCargaArticulosContenedor" class="cargaArticulosContenedor">
        <div id="idCargaArticulosElementos" class="cargaArticulosElementos">
        </div>
      </section>
      <!-- titulo pricipal -->
      <div class="headerContenedor">  
        <div class="headerContenedorElementos">
          <h1 class="headerTitulo">
            Compras
          </h1>
          <nav>
            <a href="./pages/carga.html" class="headerRef">Carga de Articulos Nuevos</a>
          </nav>
        </div>
      </div>
    </header>
    <!-- contenedor principal -->
    <main>
      <div id="idMainContenedor" class="mainContenedor">
        <div id="idMainContenedorElementos" class="mainContenedorElementos">
          <div class="mainCategoriaFila">
            <label class="labelGlobal" for="idBuscarArticuloCategoria"
              >Categoria:</label
            >
            <select
              id="idBuscarArticuloCategoria"
              name="buscarArticuloCategoria"
              required
            >
              <option value="" selected>Seleccione Una Categoria</option>
              <option value="TELEVISOR">TELEVISORES</option>
              <option value="COCINA">COCINAS</option>
              <option value="HELADERA">HELADERAS</option>
            </select>
          </div>

          <div  id="idMainContenedorResultados" class="mainContenedorResultados">
            <div id="idMainResultados" class="mainResultados">

            </div>
          </div>

          <h2 id="idTituloBotonesCarrito" class="mainTitulo">
            Carrito de Compras
          </h2>
          <div
            id="idMainContenedorCarritoComprasBotones"
            class="mainContenedorCarritoComprasBotones"
          >
            <div
              id="idMainCarritoComprasBotones"
              class="mainCarritoComprasBotones"
            >
              <button id="idBotonVerCarritoCompras" class="buttonGlobal">
                Ver
              </button>
              <button id="idBotonOcultarCarritoCompras" class="buttonGlobal">
                Ocultar
              </button>
              <button id="idBotonVaciarCarritoCompras" class="buttonGlobal">
                Vaciar
              </button>
              <button id="idBotonConfirmarCarritoCompras" class="buttonGlobal">
                Confirmar
              </button>
            </div>
          </div>
          <div
            id="idMainContenedorCarritoCompras"
            class="mainContenedorCarritoCompras"
          >
            <p id="idTotalCarrito" class="totalCarrito"></p>
            <div id="idMainCarritoCompras" class="mainCarritoCompras"></div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
     <!-- TOASTIFY - SCRIPT -->
     <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </body>
</html>
