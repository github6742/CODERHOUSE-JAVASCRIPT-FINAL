<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carga de Articulos Nuevos</title>
    <!-- TOASTIFY - STYLES -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <script defer src="../js/main.js"></script>
    <script defer src="../js/carga.js"></script>
  </head>
  <body>
    <header>
      <!-- titulo pricipal -->
      <div class="headerContenedor">
        <div class="headerContenedorElementos">
          <h1 class="headerTitulo">Carga de Articulos Nuevos</h1>
          <nav>
            <a href="../index.html" class="headerRef">Volver a Compras</a>
          </nav>
        </div>
      </div>
    </header>
    <!-- contenedor principal -->
    <main>
      <div id="idMainContenedor" class="mainContenedor">
        <div id="idMainContenedorElementos" class="mainContenedorElementos">
          <h2 id="idMainTituloCrear" class="mainTitulo">Crear Articulo</h2>

          <div
            id="idMainContenedorFormularioCrear"
            class="mainContenedorFormulario"
          >
            <form
              id="idMainFormularioCrear"
              class="mainFormulario"
              method="POST"
            >
              <div class="mainFormularioFila">
                <label class="labelGlobal" for="idCrearArticuloCodigo"
                  >Codigo:</label
                >
                <input
                  class="inputGlobal"
                  type="text"
                  id="idCrearArticuloCodigo"
                  name="crearArticuloCodigo"
                  required=""
                />
              </div>
              <div class="mainFormularioFila">
                <label class="labelGlobal" for="idCrearArticuloNombre"
                  >Nombre:</label
                >
                <input
                  class="inputGlobal"
                  type="text"
                  id="idCrearArticuloNombre"
                  name="crearArticuloNombre"
                  required=""
                />
              </div>
              <div class="mainFormularioFila">
                <label class="labelGlobal" for="idCrearArticuloMarca"
                  >Marca:</label
                >
                <input
                  class="inputGlobal"
                  type="text"
                  id="idCrearArticuloMarca"
                  name="crearArticuloMarca"
                  required=""
                />
              </div>
              <div class="mainFormularioFila">
                <label class="labelGlobal" for="idBuscarArticuloCategoria"
                  >Categoria:</label
                >
                <select
                  id="idCrearArticuloCategoria"
                  name="crearArticuloCategoria"
                  required
                >
                  <option value="" selected>Seleccione Una Categoria</option>
                  <option value="TELEVISOR">TELEVISOR</option>
                  <option value="COCINA">COCINA</option>
                  <option value="HELADERA">HELADERA</option>
                </select>
              </div>
              <div class="mainFormularioFila">
                <label class="labelGlobal" for="idCrearArticuloPrecio"
                  >Precio:</label
                >
                <input
                  class="inputGlobal"
                  type="number"
                  id="idCrearArticuloPrecio"
                  name="crearArticuloPrecio"
                  required=""
                />
              </div>
              <div class="mainFormularioFila">
                <button
                  id="idBotonCrearArticulo"
                  class="buttonGlobal"
                  type="submit"
                >
                  Guardar
                </button>
              </div>
            </form>
          </div>
          <div id="idMainContenedorResultadosArtCreado" class="mainContenedorResultados">
            <div id="idMainResultadosArtCreado" class="mainResultados">

            </div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <!-- TOASTIFY - SCRIPT -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
  </body>
</html>
